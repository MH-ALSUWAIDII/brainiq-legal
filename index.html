<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrainIQ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root{--bg:#F4F3EE;--card:#fff;--ink:#15213A;--ink2:#5C6884;--accent:#DE4429;--hair:#E2E0D6}
@media (prefers-color-scheme:dark){:root{--bg:#0D1421;--card:#161F33;--ink:#E9E8E0;--ink2:#94A0BE;--accent:#FF6B52;--hair:#2A3450}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
  display:grid;place-items:center;min-height:100vh;padding:32px;line-height:1.8}
.card{background:var(--card);border:1px solid var(--hair);border-radius:20px;padding:40px 34px;max-width:460px;text-align:center}
.mark{font-weight:700;font-size:34px;letter-spacing:-.03em;direction:ltr;margin-bottom:6px}
.mark span{color:var(--accent)}
p{color:var(--ink2);margin:0 0 26px}
a{display:inline-block;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--accent);border-radius:12px;padding:11px 26px}
a:hover{background:var(--accent);color:var(--card)}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">Brain<span>IQ</span></div>
    <p>مِسبار قياس الذكاء — اختبار قدرات عقلية لأجهزة iPhone</p>
    <a href="privacy/">سياسة الخصوصية</a>
  </div>
</body>
</html>
